name: build-uefi
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential uuid-dev iasl nasm python3 python3-distutils git python3-pip

      - name: Clone edk2 and prepare BaseTools
        run: |
          set -euxo pipefail
          git clone https://github.com/tianocore/edk2.git edk2
          cd edk2
          git submodule update --init --recursive
          make -C BaseTools
          cp -n BaseTools/Conf/tools_def.template Conf/tools_def.txt || true

      - name: Copy payload into edk2 tree
        run: |
          set -euxo pipefail
          rm -rf edk2/MyPayload
          mkdir -p edk2/MyPayload
          if [ -d src ]; then
            cp -r src/* edk2/MyPayload/
          else
            echo "Warning: src/ not found — nothing to copy"
          fi

      - name: Register INF in MdeModulePkg.dsc (idempotent)
        run: |
          set -euxo pipefail
          cd edk2
          if ! grep -q "MyPayload/MyPayload.inf" MdeModulePkg/MdeModulePkg.dsc; then
            awk '/^

\[Components\]

/{print; print "  ../MyPayload/MyPayload.inf"; next}1' MdeModulePkg/MdeModulePkg.dsc > /tmp/MdeModulePkg.dsc.tmp && mv /tmp/MdeModulePkg.dsc.tmp MdeModulePkg/MdeModulePkg.dsc
          else
            echo "MyPayload.inf already registered in MdeModulePkg.dsc"
          fi

      - name: Configure target and toolchain, source env, build
        shell: bash -l {0}
        run: |
          set -euxo pipefail
          cd edk2
          mkdir -p Conf
          cat > Conf/target.txt <<'EOF'
ACTIVE_PLATFORM = MdeModulePkg/MdeModulePkg.dsc
TARGET = RELEASE
TOOL_CHAIN_TAG = GCC5
ARCH = X64
EOF
          . ./edksetup.sh
          build -p MdeModulePkg/MdeModulePkg.dsc -a X64 -b RELEASE -t GCC5

      - name: Upload .efi artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyPayload-efi
          path: edk2/Build/**/X64/*.efi
