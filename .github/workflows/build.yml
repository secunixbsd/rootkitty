name: build-uefi
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential uuid-dev iasl nasm python3 python3-distutils git

      - name: Clone EDK II
        run: |
          git clone https://github.com/tianocore/edk2.git
          cd edk2
          git submodule update --init
          make -C BaseTools
          cp BaseTools/Conf/tools_def.template Conf/tools_def.txt

      - name: Copy payload into edk2 tree
        run: |
          cp -r src edk2/MyPayload

      - name: Register INF in DSC
        run: |
          cd edk2
          awk '/^

\[Components\]

/{print; print "  ../MyPayload/MyPayload.inf"; next}1' MdeModulePkg/MdeModulePkg.dsc > tmp && mv tmp MdeModulePkg/MdeModulePkg.dsc

      - name: Set toolchain and build
        run: |
          cd edk2
          echo "ACTIVE_PLATFORM = MdeModulePkg/MdeModulePkg.dsc" > Conf/target.txt
          echo "TARGET = RELEASE" >> Conf/target.txt
          echo "TOOL_CHAIN_TAG = GCC5" >> Conf/target.txt
          echo "ARCH = X64" >> Conf/target.txt
          . ./edksetup.sh
          build

      - name: Upload .efi artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyPayload.efi
          path: edk2/Build/**/X64/*.efi
